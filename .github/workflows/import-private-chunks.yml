name: One-time import of four verified BA5390 chunks
# One-time import using short-lived, read-only URLs for exactly four artifact ZIPs.
# No private-repository token is provided to this public runner.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        index: [0, 1, 2, 3]
    env:
      FRAMEFORGE_RENDER_PROJECT: production/ba5390/render-project.json
      SOURCE_KEY: 82297f8a1020ff7307681e42
    steps:
      - uses: actions/checkout@v4
      - name: Ensure FFmpeg
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Download only the authorized artifact using its expiring URL
        env:
          CHUNK_URL: ${{ secrets[format('FRAMEFORGE_CHUNK_URL_{0}', matrix.index)] }}
        run: |
          python3 - <<'PYTHON'
          import io,os,sys,urllib.request,urllib.parse,zipfile
          from pathlib import Path
          url=os.environ.pop('CHUNK_URL','')
          if urllib.parse.urlparse(url).scheme!='https':
              sys.exit('Missing or invalid short-lived artifact URL; refresh the import grant.')
          try:
              with urllib.request.urlopen(url,timeout=120) as response:
                  data=response.read(100_000_001)
              if len(data)>100_000_000: raise ValueError('Artifact exceeds limit')
              with zipfile.ZipFile(io.BytesIO(data)) as archive:
                  folder=Path('in/chunk');folder.mkdir(parents=True,exist_ok=True)
                  for name in ['chunk.mp4','manifest.json']:
                      if archive.getinfo(name).file_size>100_000_000: raise ValueError('Entry exceeds limit')
                      (folder/name).write_bytes(archive.read(name))
          except Exception:
              sys.exit('Artifact download failed. Refresh the expiring grant; no credentials were logged.')
          PYTHON
      - name: Prove integrity against the original manifest, then re-key for this repository
        id: rekey
        run: |
          python3 - <<'PY'
          import os,sys
          sys.path.insert(0,'scripts/pipeline')
          import pipeline as p
          i=int(os.environ['INDEX']);key=p.fingerprint()
          p.verify_segment('in/chunk',i,os.environ['SOURCE_KEY'])          # same file sha256 + all 300 decoded frame hashes
          p.verify_segment('in/chunk',i,key,create=True)                     # manifest for this repo's fingerprint
          p.verify_segment('in/chunk',i,key)
          open(os.environ['GITHUB_OUTPUT'],'a').write(f'key={key}\n')
          print(f'Chunk {i} verified and re-keyed')
          PY
        env:
          INDEX: ${{ matrix.index }}
      - uses: actions/upload-artifact@v4
        with:
          name: claude-ba5390-chunk-${{ steps.rekey.outputs.key }}-${{ matrix.index }}
          path: |
            in/chunk/chunk.mp4
            in/chunk/manifest.json
          if-no-files-found: error
          retention-days: 30
